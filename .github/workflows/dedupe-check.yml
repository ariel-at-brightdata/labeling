name: scored_csv duplicate check
on:
  push:
    paths: ["scored_csv/**"]
  pull_request:
    paths: ["scored_csv/**"]
jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: one home per channel
        run: python scripts/check_duplicates.py
